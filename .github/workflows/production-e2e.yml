name: Production End-to-End Validation

on:
  # Temporary branch trigger used to prove the profile before this workflow is
  # available on the default branch. Removed after the recorded validation.
  push:
    branches: [test/production-e2e]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type production to allow temporary routing resources
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-e2e:
    name: Production API (k3s)
    if: github.event_name == 'push' || inputs.confirmation == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      WHR_OPERATOR_E2E_PRODUCTION: "true"
      WHR_OPERATOR_E2E_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      WHR_E2E_RELAY_KEY: ${{ secrets.WHR_E2E_RELAY_KEY }}
      WHR_E2E_RELAY_SECRET: ${{ secrets.WHR_E2E_RELAY_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production reconciliation
        run: make e2e

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-production-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test/artifacts/
          if-no-files-found: warn
          retention-days: 7
