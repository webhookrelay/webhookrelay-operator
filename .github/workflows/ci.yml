name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"

      - name: Run tests
        run: make test

      - name: Install linter
        run: make golangci-lint

      - name: Run lint
        run: make lint

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Helm
        run: ./.test/install-helm.sh .test/helm

      - name: Lint and render chart
        run: |
          .test/helm lint charts/webhookrelay-operator
          .test/helm template webhookrelay-operator charts/webhookrelay-operator >/dev/null

  e2e:
    name: End-to-End and Helm Lifecycle (k3s)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run isolated k3s test
        run: make e2e

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: operator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test/artifacts/
          if-no-files-found: warn
          retention-days: 7
