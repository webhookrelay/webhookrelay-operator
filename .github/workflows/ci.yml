name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.19"

      - name: Run tests
        run: make test

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        run: ./.test/install-helm.sh .test/helm

      - name: Lint and render chart
        run: |
          .test/helm lint charts/webhookrelay-operator
          .test/helm template webhookrelay-operator charts/webhookrelay-operator >/dev/null

  e2e:
    name: End-to-End Tests (k3s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run isolated k3s test
        run: make e2e

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test/artifacts/
          if-no-files-found: warn
          retention-days: 7
