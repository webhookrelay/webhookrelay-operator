# Default values for webhookrelay-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: webhookrelay/webhookrelay-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.7.0"

credentials:
  key: ""
  secret: ""

httpsProxy: ""

# Trusted operator-wide Relay API base URL. Do not point this at an endpoint
# you do not administer because Relay credentials are sent to it.
apiEndpointURL: "https://my.webhookrelay.com/v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "webhookrelay-operator"

crd:
  create: false

rbac:
  create: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8383"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
